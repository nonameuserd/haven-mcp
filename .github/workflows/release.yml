# Create a GitHub Release when package.json version has no matching tag yet.
# Runs on every push to main (including the sync/publish flow from Chitmark).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.pkg.outputs.tag }} already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          NAME="${{ steps.pkg.outputs.name }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "${NAME} ${TAG}" \
            --generate-notes
